[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "techieray-training-lab"
version = "0.2.0"
description = "Training sets for AI and technology law, built to be used as reinforcement learning environments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT (code); see each set for its data licence"}
authors = [{name = "techieray", email = "info@techieray.com"}]
dependencies = []

[project.scripts]
techieray-lab = "techieray_training_lab.cli:main"

[project.optional-dependencies]
grader = ["anthropic>=2.8,<3"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://www.techieray.com"

[tool.setuptools.packages.find]
where = ["src"]
include = ["techieray_training_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
